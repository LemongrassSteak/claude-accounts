name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run regression tests
        run: dotnet run --project tests/ClaudeAccounts.Tests -c Release
      - name: Build desktop app
        run: dotnet build src/ClaudeAccounts.App -c Release
